<div>
  <h2 mat-dialog-title>Create New Playlist</h2>
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Enter Playlist name</mat-label>
      <input matInput [(ngModel)]="playlistName" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onClose()"> Cancel</button>
    <button mat-button (click)="onSubmit()" cdkFocusInitial>Ok</button>
  </mat-dialog-actions>
</div>
