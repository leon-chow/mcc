<div class="container">
  <app-youtube-player videoId="{{videoId}}" (playNext)="playNextSong()"/>
</div>
<div class="container"> 
  <mat-form-field class="search-input">
    <input matInput type="text" (input)="onSearchChange($event)" placeholder="Enter an OST name or Description...">
  </mat-form-field>
</div>
<br>
<table mat-table [dataSource]="musicTableDataSource" class="table">
  <ng-container matColumnDef="mark">
    <th mat-header-cell *matHeaderCellDef> </th>
    <td class="song-logo-cell" mat-cell *matCellDef="let song"> <img src="https://maplestory-music.github.io/mark/{{song.mark}}.png">  </td>
  </ng-container>
  <ng-container matColumnDef="songName">
    <th mat-header-cell *matHeaderCellDef> Song name </th>
    <td class="song-name-cell" mat-cell *matCellDef="let song"> <button class="song-button" mat-flat-button (click)="playSong(song.youtube)"> {{song.metadata.title}} </button> </td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> Description </th>
    <td mat-cell *matCellDef="let song"> {{song.description}} </td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let song"> {{song.source.date}} </td>
  </ng-container>

  <ng-container matColumnDef="folder">
    <th mat-header-cell *matHeaderCellDef> Folder </th>
    <td mat-cell *matCellDef="let song"> {{song.source.structure}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons> </mat-paginator>
